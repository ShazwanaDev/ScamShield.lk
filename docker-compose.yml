services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: scamshield
      POSTGRES_DB: scamshield
    ports:
      - "5432:5432"
    volumes:
      - scamshield_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://scamshield:scamshield@postgres:5432/scamshield
      REDIS_URL: redis://redis:6379/0
      # read from the .env file next to this one; admin sign-in stays off until ADMIN_PASSWORD is set
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "5000:5000"
    volumes:
      - ./ml/models:/app/../ml/models:ro
      # predictions reuse the training-time text cleaning in ml/src/text_cleaning.py
      - ./ml/src:/app/../ml/src:ro

volumes:
  scamshield_pgdata:
